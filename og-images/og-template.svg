<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#1E1B4B"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Accent line top -->
  <rect width="1200" height="4" fill="url(#og-accent)"/>

  <!-- Logo mark -->
  <rect width="64" height="64" rx="14" x="80" y="80" fill="url(#og-accent)"/>
  <text x="112" y="124" font-family="Syne,system-ui,sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle">C</text>

  <!-- Service name placeholder -->
  <text x="80" y="300" font-family="Syne,system-ui,sans-serif" font-size="64" font-weight="800" fill="#F5F3FF">{{SERVICE_NAME}}</text>

  <!-- Description placeholder -->
  <text x="80" y="360" font-family="Figtree,system-ui,sans-serif" font-size="24" font-weight="400" fill="#A5B4FC">{{DESCRIPTION}}</text>

  <!-- Domain -->
  <text x="80" y="560" font-family="JetBrains Mono,monospace" font-size="18" font-weight="500" fill="#818CF8">{{DOMAIN}}.chitty.cc</text>

  <!-- ChittyOS wordmark bottom right -->
  <text x="1120" y="560" font-family="Syne,system-ui,sans-serif" font-size="20" font-weight="700" fill="#6366F1" text-anchor="end">ChittyOS</text>
</svg>
