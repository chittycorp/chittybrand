name = "chittybrand-cdn"
main = "src/index.ts"
compatibility_date = "2026-08-07"

# Development
[vars]
ENVIRONMENT = "development"

[[r2_buckets]]
binding = "BRAND_ASSETS"
bucket_name = "chitty-brand-assets"

# Production
[env.production]
routes = [
  { pattern = "brand.chitty.cc", custom_domain = true },
  { pattern = "chitty.cc/*", zone_name = "chitty.cc" }
]

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.r2_buckets]]
binding = "BRAND_ASSETS"
bucket_name = "chitty-brand-assets"

[[tail_consumers]]
service = "chittytrack"

[observability]
enabled = true
